<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eu vou para a Ane Cakes Fair!</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#fff7f2,#ffe5ee);color:#351d2a}.wrap{max-width:1050px;margin:auto;padding:32px 18px 50px}.hero{text-align:center}.hero h1{font-size:clamp(2rem,5vw,3.4rem);color:#7b214c;margin:8px}.hero p{color:#684d59}.layout{display:grid;grid-template-columns:350px 1fr;gap:26px;align-items:start}.panel,.preview{background:#fff;border-radius:24px;padding:22px;box-shadow:0 15px 45px #6d29401c}.label{display:block;font-weight:bold;margin:18px 0 8px}input{width:100%;padding:13px;border:1px solid #dfc4cf;border-radius:12px;font-size:16px}input[type=file]{border:2px dashed #d99ab2;background:#fff9fb}button{width:100%;border:0;border-radius:13px;padding:14px;margin-top:12px;font-weight:bold;font-size:16px;cursor:pointer}.primary{background:#7b214c;color:#fff}.secondary{background:#f6e1e9;color:#7b214c}.hint{font-size:.9rem;color:#806a74;line-height:1.45}.preview{background:#fff9fb;padding:18px}canvas{display:block;width:100%;height:auto;border-radius:18px}.status{text-align:center;color:#7b214c;min-height:20px;margin-top:10px}@media(max-width:780px){.layout{grid-template-columns:1fr}}</style></head><body><div class="wrap"><header class="hero"><div style="font-size:3rem">🍰</div><h1>Eu vou para a Ane Cakes Fair!</h1><p>Coloque sua foto e crie sua tag personalizada para compartilhar.</p></header><main class="layout"><section class="panel"><h2>Crie sua tag</h2><label class="label">Sua foto</label><input id="photo" type="file" accept="image/*"><label class="label">Seu nome (opcional)</label><input id="name" maxlength="40" placeholder="Digite seu nome"><button class="primary" id="download">Baixar minha tag</button><button class="secondary" id="share">Compartilhar</button><p class="hint">A foto é processada no seu navegador. A arte pronta pode ser baixada e publicada nas redes sociais.</p><div class="status" id="status"></div></section><section class="preview"><canvas id="c" width="1080" height="1350"></canvas></section></main></div><script>const c=document.getElementById('c'),x=c.getContext('2d'),p=document.getElementById('photo'),n=document.getElementById('name'),s=document.getElementById('status');let img=null;function rr(a,b,w,h,r){x.beginPath();x.roundRect(a,b,w,h,r);x.closePath()}function draw(){let w=1080,h=1350,g=x.createLinearGradient(0,0,w,h);g.addColorStop(0,'#fff8f4');g.addColorStop(1,'#f9d9e4');x.fillStyle=g;x.fillRect(0,0,w,h);x.textAlign='center';x.fillStyle='#7b214c';x.font='700 42px Arial';x.fillText('ANE CAKES FAIR',540,90);x.fillStyle='#351d2a';x.font='700 76px Arial';x.fillText('EU VOU PARA',540,180);x.fillStyle='#7b214c';x.font='800 82px Arial';x.fillText('A ANE CAKES FAIR!',540,280);x.fillStyle='#fff';rr(315,330,450,100,35);x.fill();x.fillStyle='#e86c9a';rr(350,405,380,95,22);x.fill();x.fillStyle='#7b214c';x.font='700 46px Arial';x.fillText('2026',540,467);x.save();rr(180,555,720,570,45);x.clip();if(img){let sc=Math.max(720/img.width,570/img.height),dw=img.width*sc,dh=img.height*sc;x.drawImage(img,540-dw/2,840-dh/2,dw,dh)}else{x.fillStyle='#f3e2e8';x.fillRect(180,555,720,570);x.fillStyle='#9a6b7c';x.font='700 40px Arial';x.fillText('Sua foto aparecerá aqui',540,850)}x.restore();x.strokeStyle='#fff';x.lineWidth=14;rr(180,555,720,570,45);x.stroke();x.fillStyle='#fff';rr(250,1070,580,100,50);x.fill();x.fillStyle='#7b214c';x.font='700 40px Arial';x.fillText(n.value.trim()||'Eu vou para a Ane Cakes Fair!',540,1135);x.fillStyle='#684d59';x.font='500 28px Arial';x.fillText('Compartilhe sua presença!',540,1250)}p.onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader;r.onload=()=>{img=new Image;img.onload=draw;img.src=r.result};r.readAsDataURL(f)};n.oninput=draw;document.getElementById('download').onclick=()=>{let a=document.createElement('a');a.download='eu-vou-para-ane-cakes-fair.png';a.href=c.toDataURL('image/png');a.click();s.textContent='Tag baixada com sucesso!'};document.getElementById('share').onclick=async()=>{try{let b=await new Promise(r=>c.toBlob(r,'image/png')),f=new File([b],'eu-vou-para-ane-cakes-fair.png',{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({title:'Eu vou para a Ane Cakes Fair!',text:'Eu vou para a Ane Cakes Fair!',files:[f]});else{await navigator.clipboard.writeText(location.href);s.textContent='Link da página copiado!'}}catch(e){s.textContent='Baixe a tag e compartilhe a imagem.'}};draw();</script></body></html>
